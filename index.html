:root{--ink:#1e1b4b;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ee6a6;--sky:#4cc9f0;--grape:#7c3aed;--cream:#fff8e7;--gold:#FFD600;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--cream);}
body{
  min-height:100vh;min-height:100dvh;display:flex;padding:clamp(10px,3vw,24px);
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background-color:var(--cream);
  background-image:radial-gradient(rgba(255,150,60,.30) 1.4px,transparent 1.6px);background-size:22px 22px;
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes drive{0%{left:102%}100%{left:-34%}}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(14px,-22px) scale(1.4)}}
@keyframes vbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes vbBubbleIn{0%{opacity:0;transform:scale(.6) translateY(6px)}60%{opacity:1;transform:scale(1.08) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

.wrap{position:relative;z-index:1;width:min(660px,100%);margin:auto;}
@media(min-width:700px){.wrap{width:min(860px,100%);}}
.card{background:#fff;border:3px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--ink);}

/* ── HERO ── */
.hero{text-align:center;padding:clamp(16px,4vw,24px) clamp(14px,4vw,28px) clamp(12px,3vw,18px);
  background:linear-gradient(#fff,var(--cream));border-bottom:3px solid var(--ink);}
.hero-icon{display:block;width:clamp(68px,17vw,88px);height:clamp(68px,17vw,88px);margin:0 auto 8px;object-fit:cover;background:#16204a;border:3px solid var(--ink);border-radius:22%;box-shadow:0 4px 0 var(--ink);}
.title{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(26px,7vw,42px);color:var(--ink);line-height:1.1;}
.sub{margin-top:4px;color:var(--grape);font-size:clamp(10px,2.6vw,13px);font-weight:900;letter-spacing:1.2px;text-transform:uppercase;}
.hero-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;}
.stat-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:20px;white-space:nowrap;
  font-family:'Fredoka One',cursive;font-size:clamp(11px,3vw,13px);color:var(--ink);background:var(--sun);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);}
.stat-badge:nth-child(2){background:var(--mint);}
.stat-badge:nth-child(3){background:var(--sky);}
.stat-badge:nth-child(4){background:#ffb3b3;}
/* continuar */
.resume{display:none;margin:14px auto 0;max-width:420px;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);
  font-family:'Fredoka One',cursive;font-size:clamp(14px,4vw,17px);padding:10px 22px;border-radius:50px;
  background:var(--sun);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.resume.on{display:flex;}
.resume:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
.resume:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.resume:focus-visible{outline:3px solid var(--grape);outline-offset:3px;}
.resume small{font-family:'Nunito',sans-serif;font-weight:900;font-size:.68em;letter-spacing:.8px;text-transform:uppercase;opacity:.8;}

/* ── JOGOS ── */
.games{padding:clamp(14px,3vw,20px) clamp(12px,3vw,20px) clamp(16px,3vw,22px);}
.games-label{display:flex;align-items:center;gap:10px;font-family:'Fredoka One',cursive;font-weight:400;color:var(--ink);font-size:clamp(12px,3vw,14px);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:14px;}
.games-label::before,.games-label::after{content:'';flex:1;border-top:3px dotted rgba(30,27,75,.28);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-height:480px) and (orientation:landscape){.grid{grid-template-columns:repeat(4,1fr);}}

/* ── GRUPOS (como no Pensamento Computacional) ── */
.grp{grid-column:1/-1;display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 2px;padding:10px 18px;cursor:pointer;user-select:none;text-align:left;
  font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(17px,4.6vw,22px);color:var(--ink);background:var(--gc,#ffd23f);
  border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.grp:first-child{margin-top:0;}
.grp:hover{filter:brightness(1.04);}
.grp:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.grp:focus-visible{outline:4px solid var(--grape);outline-offset:3px;}

function rrVan(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();

function modal(h){M.innerHTML='<div class="mbox">'+h+'<div class="sig">© Prof.ª Vanda Várzea</div></div>';M.hidden=false;}

/* === MENU === */
const GROUPS=[{e:"💻",n:"Conhecer a Tecnologia",c:"#ffd23f",t:["O Computador", "Ficheiros e Pastas", "A Internet", "Robôs e Inteligência Artificial"]},{e:"🛡️",n:"Segurança Online",c:"#4cc9f0",t:["Palavras-passe e Segredos", "Seguro na Internet", "Notícias Verdadeiras ou Falsas"]},{e:"🌿",n:"Bom Cidadão e Saúde",c:"#2ee6a6",t:["Bom Comportamento Online", "Saúde e Equilíbrio"]}];
let OPEN=0;try{const s=localStorage.getItem('vbq1_g');if(s!==null&&+s>=-1&&+s<GROUPS.length)OPEN=+s;}catch(e){}
const gi_=nm=>GROUPS.findIndex(g=>g.t.includes(nm));
function togG(l){const k=+l.dataset.k;OPEN=OPEN===k?-1:k;try{localStorage.setItem('vbq1_g',OPEN);}catch(e){}
 document.querySelectorAll('#grid .grp').forEach(x=>x.setAttribute('aria-expanded',+x.dataset.k===OPEN));
 document.querySelectorAll('#grid .game').forEach(x=>x.classList.toggle('gh',+x.dataset.g!==OPEN));
 if(OPEN===k)setTimeout(()=>{try{l.scrollIntoView({block:'start',behavior:O.calm?'auto':'smooth'});}catch(e){}},60);}

function hub(){M.hidden=true;P.hidden=true;H.hidden=false;try{speechSynthesis.cancel();}catch(e){}
 let n=0;
 const card=(t,i,hid)=>{const b=B[t[2]],m=Math.min(10,t[3].length);if(b!==undefined)n++;
  return '<div class="game'+(hid?' gh':'')+'" role="button" tabindex="0" data-i="'+i+'" data-g="'+gi_(t[2])+'" style="--gc:'+COLORS[i%9]+';--i:'+i+'"><div class="bubble">'+t[0]+'</div><div class="name">'+t[2]+'</div><div class="desc">'+(DESC[t[2]]||'')+'</div>'+(b!==undefined?'<div class="prog"><div class="prog-bar"><i style="width:'+b/m*100+'%"></i></div><div class="prog-txt'+(b>=m?' done':'')+'">⭐ '+b+'/'+m+'</div></div>':'')+'<div class="play">▶ Jogar</div></div>';};
 $('#grid').innerHTML=GROUPS.map((g,k)=>{const L=TOPICS.map((t,i)=>[t,i]).filter(x=>g.t.includes(x[0][2]));
  const open=OPEN===k,done=L.filter(x=>B[x[0][2]]!==undefined).length;
  return '<div class="grp" role="button" tabindex="0" data-k="'+k+'" aria-expanded="'+open+'" style="--gc:'+g.c+'"><span class="gi">'+g.e+'</span><span class="gt">'+g.n+'</span><span class="gn">⭐ '+done+'/'+L.length+'</span></div>'+L.map(x=>card(x[0],x[1],!open)).join('');}).join('');
 $('#stat').textContent='⭐ '+n+' / '+TOPICS.length;
 vb('Escolhe um tema e vamos jogar! 🎮');paintTop();if(!NAME)nameModal();}

/* === JOGO === */
function start(t,col){G=t;G.col=col;deck=pickQ(t[3]).map(q=>({r:q,q:q[0],e:q[5]||'',ord:q[7]==='o',img:q[8]||'',k:0,o:sh(q.slice(1,5).filter(Boolean).map((x,i)=>({t:x,ok:i===0,n:i})))}));qi=0;score=0;
 H.hidden=true;M.hidden=true;P.hidden=false;P.style.setProperty('--pc',col);
 P.innerHTML='<div class="bar"><button class="btn" id="bk" aria-label="Voltar ao menu">⬅️</button><div class="ttl">'+t[0]+' '+t[2]+'</div><button class="btn" id="mu" aria-label="Sons">'+(snd?'🔊':'🔇')+'</button></div><div class="pips" id="pips"></div><div class="pbody"><div class="qq" id="qt"></div><div class="qimg" id="qimg"></div><div class="qo2" id="qo"></div><div class="fb" id="fb" aria-live="polite"></div><div class="opts"><button class="btn big" id="nx" disabled>Próxima ➡️</button></div><div class="sc" id="sc"></div></div><div class="footer"><span>© Prof.ª Vanda Várzea</span><span>💻 VanBerto\'s</span></div>';
 scrollTo(0,0);load();}
function startSur(){const all=[];TOPICS.forEach(t=>t[3].forEach(q=>all.push(q)));const t=['🎲','🎲','Desafio Surpresa',sh(all).slice(0,10)];t.sur=1;start(t,'#7c3aed');}
const pips=()=>{$('#pips').innerHTML=deck.map((_,i)=>'<span class="pip'+(i<qi||(i==qi&&lock)?' ok':i==qi?' on':'')+'"></span>').join('');};
const sc=()=>{$('#sc').textContent='⭐ Pontuação: '+score+' / '+deck.length+' · Pergunta '+(qi+1)+' de '+deck.length;};
function load(){const q=deck[qi];lock=0;$('#qt').textContent=(q.ord?'🔢 ':'')+q.q+(q.ord?' (toca pela ordem certa)':'');$('#fb').textContent='';$('#qimg').innerHTML=q.img&&IMG[q.img]?'<img alt="Imagem ilustrativa da pergunta" src="'+IMG[q.img]+'">':'';const nx=$('#nx');nx.disabled=true;nx.textContent=qi==deck.length-1?'Terminar 🏁':'Próxima ➡️';
 const box=$('#qo');box.innerHTML='';
 q.o.forEach((o,i)=>{const mm=o.t.match(/^(\p{Extended_Pictographic}\S*)\s+([\s\S]*)$/u),em=mm?mm[1]:'',tx=mm?mm[2]:o.t;
  const b=document.createElement('button'),e=document.createElement('span'),s=document.createElement('span');
  b.className='o';b.dataset.i=i;e.className='eo';e.textContent=em;s.textContent=tx;em?b.append(e,s):b.append(s);box.append(b);});
 pips();sc();say(q.q);vb(qi==0?'Lê com atenção e escolhe! 👆':pick(['Vamos a essa! 💪','Pensa bem! 🤔','Tu consegues! 🌟']));}
function ans(o){const q=deck[qi];if(q.ord)return ansOrd(o);
 if(q.o[+o.dataset.i].ok){lock=1;o.classList.add('right');if(!q.miss)score++;sOk();$('#fb').textContent='✔️ Muito bem!'+(q.e?' 💡 '+q.e:'');
  $('#qo').querySelectorAll('.o').forEach(b=>b.disabled=true);$('#nx').disabled=false;vb(pick(OK),'happy');pips();}
 else{q.miss=1;o.classList.add('bad');o.disabled=true;sBad();$('#fb').textContent='❌ Não é essa. Tenta outra vez!';shake(o);vb(pick(ERR));}
 sc();}
function ansOrd(o){const q=deck[qi],ob=q.o[+o.dataset.i];
 if(ob.n===q.k){q.k++;o.classList.add('right');o.disabled=true;o.insertAdjacentHTML('afterbegin','<b>'+q.k+'º</b>');sOk();
  if(q.k===q.o.length){lock=1;if(!q.miss)score++;$('#fb').textContent='✔️ Ordem certa!'+(q.e?' 💡 '+q.e:'');$('#nx').disabled=false;vb(pick(OK),'happy');pips();}else $('#fb').textContent='✔️ Continua: qual vem a seguir?';}
 else{q.miss=1;sBad();$('#fb').textContent='❌ Ainda não é o passo seguinte.';shake(o);vb(pick(ERR));}
 sc();}
const rightTxt=q=>q.ord?q.o.slice().sort((a,b)=>a.n-b.n).map(x=>x.t).join(' → '):q.o.find(x=>x.ok).t;
function review(){ENDH=ENDH||M.innerHTML;const L=deck.filter(q=>q.miss);
 modal('<h2 style="font-size:28px">🔍 Rever erros</h2><div style="text-align:left;font-family:Nunito,sans-serif;font-weight:900">'+L.map(q=>'<p style="margin:10px 0;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#fff8e7">'+esc(q.q)+'<br>✅ '+esc(rightTxt(q))+(q.e?'<br>💡 '+esc(q.e):'')+'</p>').join('')+'</div><div class="opts"><button class="btn big" id="rt">🔁 Repetir só os erros</button><button class="btn big" id="rb">⬅️ Voltar</button></div>');}
function retry(){const t=[G[0],G[1],G[2],deck.filter(q=>q.miss).map(q=>q.r)];t.rev=1;t.full=G.full||G;t.sur=G.sur;start(t,G.col);}
function end(){const n=deck.length;if(!G.rev){B[G[2]]=Math.max(score,B[G[2]]===undefined?0:B[G[2]]);try{localStorage.setItem('vbq1',JSON.stringify(B));}catch(e){}}
 const s=score>=n*.9?3:score>=n*.6?2:1;LAST={sc:score,n:n,s:s};fx();sWin();vb('Fantástico! Terminaste! 🎉','happy');
 modal('<h2>🏁 Fim!</h2><p>Pontuação: '+score+' / '+n+'</p><div class="rc"><span>'+'⭐'.repeat(s)+'</span></div><div class="opts">'+(!G.rev&&score>=n*.6?'<button class="btn big" id="dp">🎓 Diploma</button>':'')+(deck.some(q=>q.miss)?'<button class="btn big" id="rv">🔍 Rever erros ('+deck.filter(q=>q.miss).length+')</button>':'')+'<button class="btn big" id="ag">🔁 Recomeçar</button><button class="btn big" id="mn">📚 Escolher outro tema</button></div>');}

/* === AJUDAS === */
function cfgModal(){const T=[['snd','🔊 Sons do jogo',snd],['speak','🗣️ Ler as perguntas em voz alta',speak],['calm','🌿 Modo calmo (sem confetis nem abanões)',O.calm],['big','🔠 Letras e imagens maiores',O.big]];
 modal('<h2 style="font-size:30px">⚙️ Ajudas</h2><p>O professor escolhe o que ajuda o aluno.</p><div class="opts">'+T.map(([k,l,v])=>'<button class="btn big" data-o="'+k+'" aria-pressed="'+v+'" style="width:100%;'+(v?'':'background:#fff')+'">'+(v?'✅ ':'⬜ ')+l+'</button>').join('')+'<button class="btn big" id="mn2">Fechar</button></div>');}


/* === NÍVEL, NOME E DIPLOMA === */
let LV='F',NAME='',LAST=null,ENDH='',PEND=0;
try{LV=localStorage.getItem('vbq1d')==='D'?'D':'F';NAME=localStorage.getItem('vbq1n')||'';}catch(e){}
function pickQ(list){const w=LV==='D'?2:1,a=sh(list);a.sort((x,y)=>((y[6]||1)===w)-((x[6]||1)===w));return sh(a.slice(0,10));}
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function paintTop(){$('#lvl').textContent=LV==='D'?'🔥 Nível: Desafio':'🌱 Nível: Fácil';$('#who').textContent=NAME?'👤 '+NAME:'👤 Escrever o meu nome';}
function nameModal(){modal('<h2>👋 Como te chamas?</h2><p>O teu nome aparece no diploma.</p><input id="nmi" maxlength="30" placeholder="O teu nome" value="'+esc(NAME)+'" style="font:inherit;font-size:20px;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;width:100%;box-sizing:border-box;text-align:center"><div class="opts"><button class="btn big" id="nmok">✔️ Continuar</button></div>');setTimeout(()=>{const i=$('#nmi');i&&i.focus();},50);}
function okName(){const v=$('#nmi').value.trim();if(!v){$('#nmi').focus();return;}NAME=v;try{localStorage.setItem('vbq1n',v);}catch(e){}M.hidden=true;paintTop();if(PEND){PEND=0;showDip();}}
function dipImg(){const W=1200,H=850,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),INK='#1e1b4b',col=G.col||'#7c3aed';
 x.fillStyle='#fff8e7';x.fillRect(0,0,W,H);x.lineWidth=14;x.strokeStyle=INK;x.strokeRect(30,30,W-60,H-60);x.lineWidth=8;x.strokeStyle=col;x.strokeRect(52,52,W-104,H-104);
 x.textAlign='center';x.fillStyle=INK;x.font='86px "Fredoka One"';x.fillText('🎓 DIPLOMA',W/2,175);
 x.font='34px "Fredoka One"';x.fillText("O VanBerto's atesta que",W/2,250);
 let f=100;do{x.font=f+'px "Fredoka One"';f-=4;}while(x.measureText(NAME).width>900&&f>30);x.fillStyle=col;x.fillText(NAME,W/2,365);
 x.fillStyle=INK;x.fillRect(W/2-380,385,760,4);
 x.font='34px "Fredoka One"';x.fillText('concluiu o quiz do 1.º Ciclo — nível '+(LV==='D'?'Desafio':'Fácil'),W/2,450);
 x.font='60px "Fredoka One"';x.fillText(G[0]+' '+G[2],W/2,535);
 x.font='44px "Fredoka One"';x.fillText('Pontuação: '+LAST.sc+' / '+LAST.n+'  '+'⭐'.repeat(LAST.s),W/2,615);
 try{x.drawImage(vbFrame(false,-1,true),70,540,230,230);}catch(e){}
 x.font='30px "Fredoka One"';x.fillText(new Date().toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'}),W/2,745);
 x.fillRect(W-420,725,300,3);x.font='32px "Fredoka One"';x.fillText('Prof.ª Vanda Várzea',W-270,765);
 return c.toDataURL('image/png');}
function showDip(){if(!NAME){PEND=1;return nameModal();}ENDH=ENDH||M.innerHTML;const u=dipImg();
 modal('<h2>🎓 O teu diploma</h2><img id="dipimg" alt="Diploma" src="'+u+'" style="max-width:100%;border:3px solid var(--ink);border-radius:12px"><div class="opts"><button class="btn big" id="dpr">🖨️ Imprimir</button><button class="btn big" id="dsv">💾 Guardar imagem</button><button class="btn big" id="dbk">⬅️ Voltar</button></div>');}
$('#lvl').addEventListener('click',()=>{LV=LV==='D'?'F':'D';try{localStorage.setItem('vbq1d',LV);}catch(e){}paintTop();});
$('#who').addEventListener('click',nameModal);
M.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#nmok'))return okName();
 if(t.closest('#dp')){ENDH=M.innerHTML;return showDip();}
 if(t.closest('#dbk')){M.innerHTML=ENDH;return;}
 if(t.closest('#dsv')){const a=document.createElement('a');a.href=$('#dipimg').src;a.download='Diploma-'+NAME.replace(/\s+/g,'_')+'.png';a.click();return;}
 if(t.closest('#dpr')){let d=$('#dipPrint');if(!d){d=document.createElement('div');d.id='dipPrint';document.body.append(d);}d.innerHTML='<img src="'+$('#dipimg').src+'">';document.body.classList.add('pdip');setTimeout(()=>{print();setTimeout(()=>document.body.classList.remove('pdip'),400);},100);}});
M.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nmi')okName();});

$('#cfg').addEventListener('click',cfgModal);
$('#sur').addEventListener('click',startSur);
M.addEventListener('click',e=>{const t=e.target;const o=t.closest('[data-o]');
 if(o){const k=o.dataset.o;if(k=='snd')snd=!snd;else if(k=='speak'){speak=!speak;if(!speak)try{speechSynthesis.cancel();}catch(x){}}else O[k]=!O[k];saveO();applyO();cfgModal();return;}
 if(t.closest('#rv')){ENDH=M.innerHTML;return review();}
 if(t.closest('#rb')){M.innerHTML=ENDH;return;}
 if(t.closest('#rt'))return retry();
 if(t.closest('#ag'))return G.sur?startSur():start(G.full||G,G.col);
 if(t.closest('#mn'))return hub();
 if(t.closest('#mn2')||t===M)M.hidden=true;});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!M.hidden)M.hidden=true;});
P.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#bk'))return hub();
 if(t.closest('#mu')){snd=!snd;saveO();t.closest('#mu').textContent=snd?'🔊':'🔇';return;}
 if(t.closest('#nx')){qi++;qi>=deck.length?end():load();return;}
 const o=t.closest('.o');if(o&&!lock&&!o.disabled)ans(o);});
const pg=e=>{const l=e.target.closest('.grp');if(l)return togG(l);const g=e.target.closest('.game');if(!g)return;const i=+g.dataset.i;start(TOPICS[i],COLORS[i%9]);};
$('#grid').addEventListener('click',pg);
$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pg(e);}});
setInterval(()=>{if(!mood){face(true);setTimeout(()=>{if(!mood)face();},150);}},4200);
document.fonts.ready.then(()=>{hub();face();});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
